name = "diamond_amber"
description = """EXAMPLE cluster: amber-centre bands 4000-5100 cm-1 fitted jointly with
Gaussians after a local ASLS baseline. A new fitting method, not a reproduction of
measure_amber_center. Validate before relying on it.
[CITATION NEEDED: amber-centre band positions]"""
x_unit = "cm-1"
normalize_by = "thickness"

[[features]]
name = "amber"
region = [3990, 5150]
model = "gaussian"

[[features.baseline]]
method = "asls"
lam = 1e5
p = 0.0005
median_filter = 5

